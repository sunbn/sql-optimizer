<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head}"></head>
<body>
    <div th:replace="~{fragments/layout :: sidebar}"></div>

    <div class="main-content">
        <div class="container-fluid">
            <h3 class="mb-4" th:text="${pageTitle}">数据源管理</h3>

            <div class="card">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <span><i class="bi bi-database"></i> 数据源列表</span>
                    <button class="btn btn-sm btn-primary" data-bs-toggle="modal" data-bs-target="#addModal">
                        <i class="bi bi-plus-lg"></i> 添加数据源
                    </button>
                </div>
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover mb-0">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>名称</th>
                                    <th>类型</th>
                                    <th>主机</th>
                                    <th>端口</th>
                                    <th>数据库</th>
                                    <th>状态</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="ds : ${dataSources}" th:if="${not #lists.isEmpty(dataSources)}">
                                    <td th:text="${ds.id}">1</td>
                                    <td th:text="${ds.name}">生产库</td>
                                    <td>
                                        <span class="badge bg-info" th:text="${ds.dbType}">MySQL</span>
                                    </td>
                                    <td th:text="${ds.host}">localhost</td>
                                    <td th:text="${ds.port}">3306</td>
                                    <td th:text="${ds.databaseName}">mydb</td>
                                    <td>
                                        <span class="badge badge-status" th:classappend="${ds.status == 1} ? 'bg-success' : 'bg-secondary'"
                                              th:text="${ds.status == 1} ? '启用' : '禁用'">启用</span>
                                    </td>
                                    <td>
                                        <button class="btn btn-sm btn-outline-success" th:onclick="'testConnection(' + ${ds.id} + ')'">
                                            <i class="bi bi-wifi"></i> 测试
                                        </button>
                                        <button class="btn btn-sm btn-outline-danger" th:onclick="'deleteDataSource(' + ${ds.id} + ')'">
                                            <i class="bi bi-trash"></i> 删除
                                        </button>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(dataSources)}">
                                    <td colspan="8" class="text-center text-muted py-4">暂无数据源配置</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 添加数据源Modal -->
    <div class="modal fade" id="addModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">添加数据源</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="addForm">
                        <div class="mb-3">
                            <label class="form-label">数据源名称</label>
                            <input type="text" class="form-control" name="name" required placeholder="例如：生产库">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">数据库类型</label>
                            <select class="form-select" name="dbType" required>
                                <option value="MySQL">MySQL</option>
                                <option value="PostgreSQL">PostgreSQL</option>
                                <option value="Oracle">Oracle</option>
                            </select>
                        </div>
                        <div class="row">
                            <div class="col-8 mb-3">
                                <label class="form-label">主机地址</label>
                                <input type="text" class="form-control" name="host" required placeholder="localhost">
                            </div>
                            <div class="col-4 mb-3">
                                <label class="form-label">端口</label>
                                <input type="number" class="form-control" name="port" required placeholder="3306">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">数据库名</label>
                            <input type="text" class="form-control" name="databaseName" required placeholder="数据库名称">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">用户名</label>
                            <input type="text" class="form-control" name="username" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">密码</label>
                            <input type="password" class="form-control" name="password" required>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-primary" onclick="saveDataSource()">保存</button>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/layout :: scripts}"></div>
    <script>
        function saveDataSource() {
            const form = document.getElementById('addForm');
            const formData = new FormData(form);
            const data = Object.fromEntries(formData.entries());
            data.port = parseInt(data.port);
            data.status = 1;

            fetch('/api/datasource/save', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            })
            .then(r => r.json())
            .then(data => {
                if (data.code === 200) {
                    alert('保存成功');
                    location.reload();
                } else {
                    alert('保存失败：' + data.message);
                }
            })
            .catch(err => alert('保存失败：' + err.message));
        }

        function testConnection(id) {
            fetch('/api/datasource/test-connection', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id: id })
            })
            .then(r => r.json())
            .then(data => {
                alert(data.data ? '连接成功' : '连接失败');
            });
        }

        function deleteDataSource(id) {
            if (!confirm('确定要删除该数据源吗？')) return;
            fetch('/api/datasource/delete/' + id, { method: 'POST' })
                .then(r => r.json())
                .then(data => {
                    if (data.code === 200) {
                        location.reload();
                    }
                });
        }
    </script>
</body>
</html>
