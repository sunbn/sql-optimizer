server:
  port: 8080

spring:
  application:
    name: sql-optimizer

  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://106.12.59.135:3306/sql_optimizer?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai
    username: sql_optimizer
    password: sql_optimizer_reader
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 300000
      max-lifetime: 1200000
      connection-timeout: 20000

  data:
    redis:
      host: 106.12.59.135
      port: 6379
      password: redis@123456
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    serialization:
      write-dates-as-timestamps: false

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath*:/mapper/**/*.xml

# 自定义配置
sql-optimizer:
  analysis:
    # 慢查询阈值（毫秒）
    slow-threshold: 1000
    # 最大分析SQL长度
    max-sql-length: 10000
  advisor:
    # 索引建议最大数量
    max-index-suggestions: 5
    # 是否启用规则引擎
    rule-engine-enabled: true